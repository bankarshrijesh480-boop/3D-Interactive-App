name: yourbself
description: "Premium Flutter app with Firebase Auth, glassmorphic UI, and interactive 3D particle engine."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core & Authentication
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  
  # Camera & Hand Detection
  camera: ^0.10.5
  google_mlkit_pose_detection: ^0.8.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_glassmorphism: ^1.0.0
  
  # State Management
  provider: ^6.4.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
